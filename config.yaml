# CoastTideX 配置文件
# 全球海岸带潮位模拟与高程基准转换系统 v1.5 Alpha

# 数据路径配置 (支持绝对路径或相对项目根目录路径)
paths:
  # FES2022b 原生非结构有限元网格 NetCDF 文件路径 (近岸精度最高)
  fes_ns_grid: "fes2022b/ocean_tide_non_structured/FES2022b_OceanTide_NSgrid.nc"
  
  # FES2022b 1/30° 规则网格潮位来源/外推掩膜 NetCDF 文件路径 (可选外部参考，0:Native Ocean, 1:Extrapolated Tide, 2:Land, 3:Lake)
  # 注意：当前 CoastTideX Native LGP2 主解算流程不使用此文件参与潮位计算；此文件亦不是 Hybrid MDT 基准来源掩膜。
  fes_extrapolation_mask_nc: "fes2022b/mask_fes2022B.nc"

  # FES2022b 规则外推网格目录 (备用，当前未启用外推回退)
  fes_extrapolated_dir: "fes2022b/ocean_tide_extrapolated"
  
  # CNES-CLS22 MDT 数据路径 (全球大洋参考 GOCO06s，地中海/黑海参考 EIGEN-6C4)
  mdt_nc: "mdt_cls22/mdt_hybrid_cnes_cls22_cmems2020_global.nc"
  
  # EGM2008 2.5分高分辨率全球大地水准面起伏 GeoTIFF (项目内自带)
  egm2008_tif: "data/geoid/us_nga_egm08_25.tif"

  # 全球大洋 GOCO06s 与 EGM2008 大地水准面差值栅格 (项目内自带，Delta N = N_GOCO06s - N_EGM2008)
  delta_n_goco06s_egm2008_tif: "data/geoid/delta_n_goco06s_minus_egm2008.tif"
  # 兼容旧版键名
  delta_n_tif: "data/geoid/delta_n_goco06s_minus_egm2008.tif"

  # 地中海与黑海 EIGEN-6C4 与 EGM2008 大地水准面差值栅格 (Delta N = N_EIGEN6C4 - N_EGM2008)
  # 规范默认预期路径为 data/geoid/delta_n_eigen6c4_minus_egm2008.tif (当前不随仓库捆绑，可使用 scripts/generate_delta_n.py 生成或手动指定)
  delta_n_eigen6c4_egm2008_tif: "data/geoid/delta_n_eigen6c4_minus_egm2008.tif"

  # 可选 Hybrid MDT 参考基准来源分类栅格 (GeoTIFF，0:UNKNOWN, 1:GOCO06s, 2:EIGEN-6C4(MED), 3:EIGEN-6C4(BLK), 255:NoData)。
  # 当前项目不内置该文件。
  # 留空时 DatumTransformer 使用地中海/黑海多边形 fallback，
  # 并在近似来源判断区域输出 QC_DATUM_SOURCE_APPROX。
  # 注意：这不是 FES2022b/mask_fes2022B.nc。
  hybrid_mdt_source_mask: ""

# 潮位计算配置
tide:
  # 默认使用的分潮集合：'all' 表示全套34个分潮，'major8' 表示8大主分潮
  default_constituents: "all"
  
  # 局部加载空间缓冲框范围 (度)
  spatial_buffer_deg: 1.0
  
  # 默认预测时间步长 (例如: '10min', '15min', '30min', '1h')
  default_freq: "1h"

  # 整年预测模式默认时间步长 (推荐 30min，2024闰年严格对应 17,568 样本点)
  annual_default_freq: "30min"

# 空间栅格潮汐计算引擎配置 (Spatial Raster Tide Engine v1.4)
raster:
  # FES 空间批量评估最大单次点数 (防止 M 空间点 × T 时间步一次性爆内存)
  max_fes_evaluate_points: 500000

  # 自适应控制网格初始点间距 (米)
  initial_control_spacing_m: 4000

  # 自适应控制网格最小允许间距 (米)
  min_control_spacing_m: 500

  # 潜在天文潮淹没频率误差细分阈值 (百分点)
  inundation_error_tolerance_pct: 1.0

  # 2D 栅格读写块默认尺寸 (像元)
  default_block_size: 512

  # 自适应控制网格控制节点批量评估大小 (Level-wise 批处理节点数)
  control_node_batch_size: 128

  # 控制网格细分最大绝对深度上限保护
  absolute_max_refinement_depth: 12

  # 拓扑连通防护粗粒度掩膜物理分辨率最大上限 (米，防止超大 10m GeoTIFF 被过度降采样抹平 100-300m 陆地屏障)
  topology_max_resolution_m: 100

  # 拓扑连通判定有效像元比例阈值 (保守保护陆地 NoData barrier)
  topology_valid_fraction_threshold: 0.5

  # 内存中允许驻留的最大控制节点数 (超过后抛出 RasterMemoryLimitError；v1.4 暂不引入复杂 disk-backed memmap 架构)
  max_in_memory_control_nodes: 50000

# 界面与展示默认配置
gui:
  theme: "dark"
  default_timezone: "UTC"
  default_lon: 122.0
  default_lat: 31.0
  default_location_name: "长江口 (Changjiang Estuary)"


